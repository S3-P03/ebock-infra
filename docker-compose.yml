services:

  db:
    image: postgres:13
    container_name: ebock-db
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./keycloak-db-init.sh:/docker-entrypoint-initdb.d/keycloak-db-init.sh
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - 127.0.0.1:${DB_PORT}:${DB_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ebock-net
   

  migrate:
    image: postgres:13
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
      - ./scripts:/scripts
    entrypoint: ["/scripts/migrate.sh"]
    environment:
      POSTGRES_USER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: "no"
    networks:
      - ebock-net


  backend:
    build:
      context: ..
      dockerfile: ./ebock-infra/docker/Dockerfile.backend
    container_name: ebock-backend
    restart: always
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/${DB_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_OIDC_AUTH_SERVER_URL: http://auth:${KEYCLOAK_PORT}/realms/ebock
      QUARKUS_OIDC_CLIENT_ID: ${BACKEND_KEYCLOAK_CLIENT_ID}
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${BACKEND_KEYCLOAK_SECRET}
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8180/realms/${KEYCLOAK_REALM}
      QUARKUS_HTTP_PORT: ${BACKEND_PORT}
      QUARKUS_HTTP_CORS: true
      QUARKUS_HTTP_CORS_ORIGINS: ${CORS_ORIGINS}
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: accept,authorization,content-type,x-requested-with
    ports:
      - 127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebock-net

  frontend:
    image: nginx
    container_name: ebock-frontend
    volumes:
      - ./webserver/nginx.conf:/etc/nginx/nginx.conf
      - ./webserver/includes/:/etc/nginx/includes/
      - ./webserver/html:/usr/share/nginx/html/
    ports:
      - 127.0.0.1:${FRONTEND_PORT}:80
    depends_on:
      - auth
      - backend
    networks:
      - ebock-net

  auth:
    image: quay.io/keycloak/keycloak
    container_name: auth
    volumes:
      - ./keycloak/startup-scripts/init.sh:/docker-entrypoint-sh/init.sh
      - ./tools/envsubst:/usr/local/bin/envsubst
      - ./keycloak/data:/var/tmp
    entrypoint: sh -c "/docker-entrypoint-sh/init.sh"
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      BACKEND_KEYCLOAK_CLIENT_ID: ${BACKEND_KEYCLOAK_CLIENT_ID}
      BACKEND_KEYCLOAK_SECRET: ${BACKEND_KEYCLOAK_SECRET}
      FRONTEND_KEYCLOAK_CLIENT_ID: ${FRONTEND_KEYCLOAK_CLIENT_ID}
      FRONTEND_KEYCLOAK_SECRET: ${FRONTEND_KEYCLOAK_SECRET}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
      KC_PROXY: edge
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${KEYCLOAK_PORT}/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT}:${KEYCLOAK_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      ebock-net:
      
volumes:
  db_data:

networks:
  ebock-net:
