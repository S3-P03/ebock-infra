services:

  db:
    image: postgres:13
    container_name: ebock-db
    restart: always
    ports:
      - 5444:5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../ebock-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
    networks:
      - ebock-net

  #backend:
  # image: ebock_backend
  # build:
  #   context: ../ebock-backend
  #   dockerfile: ../ebock-infra/docker/Dockerfile.backend
  # container_name: ebock-backend
  # depends_on:
  #   - db
  # networks:
  #   - ebock-net

  frontend:
    image: nginx
    container_name: ebock-frontend
    volumes:
      - ./webserver/nginx.conf:/etc/nginx/nginx.conf
      - ./webserver/includes/:/etc/nginx/includes/
      - ./webserver/html:/usr/share/nginx/html/
    ports:
      - "80:80"
    #depends_on:
    #  - backend
    networks:
      - ebock-net

  auth:
    image: quay.io/keycloak/keycloak:19.0.3
    container_name: auth
    volumes:
      - ./keycloak/data:/var/tmp
      - ./keycloak/startup-scripts/init.sh:/docker-entrypoint-sh/init.sh
    entrypoint: sh -c "/docker-entrypoint-sh/init.sh"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
    ports:
      - 8180:8180
    networks:
      ebock-net:
      
volumes:
  db_data:

networks:
  ebock-net:
