services:

  db:
    image: postgres:13
    container_name: ebock-db
    restart: always
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DATABASE: ${DB_NAME}
    networks:
      - ebock-net

  #backend:
  # image: ebock_backend
  # build:
  #   context: ../ebock-backend
  #   dockerfile: ../ebock-infra/docker/Dockerfile.backend
  # container_name: ebock-backend
  # depends_on:
  #   - db
  # networks:
  #   - ebock-net

  frontend:
    image: nginx
    container_name: ebock-frontend
    volumes:
      - ./webserver/nginx.conf:/etc/nginx/nginx.conf
      - ./webserver/includes/:/etc/nginx/includes/
      - ./webserver/html:/usr/share/nginx/html/
    ports:
      - 80:80
    #depends_on:
    #  - backend
    networks:
      - ebock-net

  auth:
    image: quay.io/keycloak/keycloak:19.0.3
    container_name: auth
    volumes:
      - ./keycloak/data:/var/tmp
      - ./keycloak/startup-scripts/init.sh:/docker-entrypoint-sh/init.sh
      - ./tools/envsubst:/usr/local/bin/envsubst
    entrypoint: sh -c "/docker-entrypoint-sh/init.sh"
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      BACKEND_KEYCLOAK_CLIENT_ID: ${BACKEND_KEYCLOAK_CLIENT_ID}
      BACKEND_KEYCLOAK_SECRET: ${BACKEND_KEYCLOAK_SECRET}
      FRONTEND_KEYCLOAK_CLIENT_ID: ${FRONTEND_KEYCLOAK_CLIENT_ID}
      FRONTEND_KEYCLOAK_SECRET: ${FRONTEND_KEYCLOAK_SECRET}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
      KC_PROXY: edge
    ports:
      - ${KEYCLOAK_PORT}:${KEYCLOAK_PORT}
    networks:
      ebock-net:
      
volumes:
  db_data:

networks:
  ebock-net:
